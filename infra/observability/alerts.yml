groups:
  - name: zentro-backend
    rules:
      - alert: BackendScrapeUnavailable
        expr: up{job="zentro-backend"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Backend metrics scrape unavailable"
          description: "Prometheus cannot scrape {{ $labels.service }}."
      - alert: BackendHttpServerErrors
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Elevated backend 5xx rate"
          description: "{{ $labels.service }} is returning server errors."
      - alert: BackendJvmMemoryPressure
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Backend heap usage is high"
          description: "Heap usage is above 90% for {{ $labels.service }}."
