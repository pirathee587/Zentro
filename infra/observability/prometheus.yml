global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: zentro-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-gateway:8080, identity-partner-service:8081, parcel-pricing-service:8082, dispatch-courier-service:8083, tracking-reporting-service:8084, notification-integration-service:8085]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        regex: '([^:]+):.*'
        replacement: '$1'
rule_files: [alerts.yml]
