server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: dispatch-courier-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  config:
    import: optional:file:./.env[.properties]
  flyway:
    # Application-side migrations are OFF by default. Shared S3 Supabase uses a
    # historical V5 lineage that differs from db/migration; migrations there run
    # only through a separately authorized runbook. See docs/development/s3-flyway-safety.md.
    # Isolated local databases and tests enable Flyway explicitly.
    enabled: false
    validate-on-migrate: true
    schemas: dispatch
    default-schema: dispatch
    create-schemas: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
zentro:
  dispatch:
    max-courier-workload: ${MAX_COURIER_WORKLOAD:10}
  identity:
    grpc-host: ${IDENTITY_GRPC_HOST:zentro-identity-partner-service}
    grpc-port: ${IDENTITY_GRPC_PORT:9081}
  pod:
    # S2 owns assignment candidate eligibility and claim state. In Compose this
    # must resolve to the S2 service DNS name, never this container's localhost.
    parcel-base-url: ${PARCEL_BASE_URL:http://localhost:8082}
    parcel-grpc-host: ${PARCEL_GRPC_HOST:zentro-parcel-pricing-service}
    parcel-grpc-port: ${PARCEL_GRPC_PORT:9082}
    token-uri: ${POD_TOKEN_URI:}
    client-id: ${POD_CLIENT_ID:}
    client-secret: ${POD_CLIENT_SECRET:}
    worker-enabled: ${POD_WORKER_ENABLED:true}
    poll-interval-ms: ${POD_POLL_INTERVAL_MS:2000}
    max-attempts: ${POD_MAX_ATTEMPTS:8}
    storage-url: ${POD_STORAGE_URL:}
    storage-service-key: ${POD_STORAGE_SERVICE_KEY:}
    storage-bucket: ${POD_STORAGE_BUCKET:swiftdrop-delivery-proofs}
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/zentro}
    audience: ${JWT_AUDIENCE:zentro-api}
    jwks-uri: ${JWT_JWKS_URI:}
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    topics:
      delivery.assigned: ${DELIVERY_ASSIGNED_TOPIC:delivery.assigned}
      delivery.reassigned: ${DELIVERY_REASSIGNED_TOPIC:delivery.reassigned}
      delivery.cancelled: ${DELIVERY_CANCELLED_TOPIC:delivery.cancelled}
management:
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
