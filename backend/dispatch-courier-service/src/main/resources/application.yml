server:
  port: ${SERVER_PORT:8083}
spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
zentro:
  security:
    issuer-uri: ${JWT_ISSUER_URI}
    audience: ${JWT_AUDIENCE}
    jwks-uri: ${JWT_JWKS_URI:}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
