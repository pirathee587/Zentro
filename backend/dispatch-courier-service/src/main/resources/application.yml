server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: dispatch-courier-service
  config:
    import: optional:file:./.env[.properties]
  flyway:
    schemas: dispatch
    default-schema: dispatch
    create-schemas: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
zentro:
  dispatch:
    max-courier-workload: ${MAX_COURIER_WORKLOAD:10}
  correlation:
    internal-base-urls:
      - ${zentro.identity.base-url}
      - ${zentro.pod.parcel-base-url}
  pod:
    parcel-base-url: ${PARCEL_BASE_URL:http://localhost:8082}
    token-uri: ${POD_TOKEN_URI:}
    client-id: ${POD_CLIENT_ID:}
    client-secret: ${POD_CLIENT_SECRET:}
    worker-enabled: ${POD_WORKER_ENABLED:true}
    poll-interval-ms: ${POD_POLL_INTERVAL_MS:2000}
    max-attempts: ${POD_MAX_ATTEMPTS:8}
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/zentro}
    audience: ${JWT_AUDIENCE:zentro-api}
    jwks-uri: ${JWT_JWKS_URI:}
management:
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
