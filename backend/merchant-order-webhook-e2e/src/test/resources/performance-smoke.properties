# Local smoke sanity bounds, never production SLAs. Change explicitly and record overrides.
requests=50
warmup=3
levelTimeoutSeconds=30
requestTimeoutSeconds=5
p95Millis=1000
degradationFactor=3
maxPayloadBytes=16777216
maxRows=10000
# Stop a scenario's ramp on errors or a missed p95 bound. Fixed request count, no timed loop.
concurrency=1,5,10,25
