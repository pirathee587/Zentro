server:
  port: ${SERVER_PORT:8084}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: tracking-reporting-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: tracking
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: tracking
    default-schema: tracking
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      group-id: ${KAFKA_CONSUMER_GROUP:tracking-reporting-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

zentro:
  service:
    token-uri: ${SERVICE_TOKEN_URI:}
    client-id: ${SERVICE_CLIENT_ID:zentro-tracking-service}
    client-secret: ${SERVICE_CLIENT_SECRET:}
  parcel:
    grpc-host: ${PARCEL_GRPC_HOST:zentro-parcel-pricing-service}
    grpc-port: ${PARCEL_GRPC_PORT:9082}
  dispatch:
    grpc-host: ${DISPATCH_GRPC_HOST:zentro-dispatch-courier-service}
    grpc-port: ${DISPATCH_GRPC_PORT:9083}
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/zentro}
    audience: ${JWT_AUDIENCE:zentro-api}
    jwks-uri: ${JWT_JWKS_URI:}
  kafka:
    enabled: ${KAFKA_CONSUMER_ENABLED:false}
management:
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
