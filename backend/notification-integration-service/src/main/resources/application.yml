server:
  port: ${SERVER_PORT:8085}
spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-integration-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Offsets are committed only after the event was stored (see ParcelEventConsumer).
      ack-mode: manual
zentro:
  security:
    issuer-uri: ${JWT_ISSUER_URI}
    audience: ${JWT_AUDIENCE}
    jwks-uri: ${JWT_JWKS_URI:}
  identity:
    # S1 Identity, used to check that a merchant is approved before it registers a webhook endpoint.
    base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  notifications:
    consumer:
      # Off by default so tests and environments without a broker never connect to Kafka.
      enabled: ${NOTIFICATIONS_CONSUMER_ENABLED:false}
    retry:
      max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
      poll-interval-ms: ${NOTIFICATION_RETRY_POLL_MS:5000}
      base-delay-ms: ${NOTIFICATION_RETRY_BASE_DELAY_MS:5000}
      max-delay-ms: ${NOTIFICATION_RETRY_MAX_DELAY_MS:600000}
    mock:
      # none | always | first-attempt (only for testing retries locally)
      fail-mode: ${NOTIFICATION_MOCK_FAIL_MODE:none}
    health:
      failed-window-minutes: ${NOTIFICATION_HEALTH_FAILED_WINDOW_MINUTES:60}
      stuck-pending-minutes: ${NOTIFICATION_HEALTH_STUCK_PENDING_MINUTES:10}
  webhooks:
    # Merchant webhook delivery (Kafka listener + retry scheduler). Off by default.
    enabled: ${WEBHOOKS_ENABLED:false}
    # DEVELOPMENT ONLY: also accept http://localhost endpoints. Keep false everywhere else.
    allow-insecure-local: ${WEBHOOKS_ALLOW_INSECURE_LOCAL:false}
    # base64 of 32 random bytes; encrypts stored signing secrets. Required when enabled. Never commit a real key.
    secret-key: ${WEBHOOK_SECRET_KEY:}
    consumer-group: ${WEBHOOK_CONSUMER_GROUP:merchant-webhooks}
    retry:
      max-attempts: ${WEBHOOK_MAX_ATTEMPTS:8}
      poll-interval-ms: ${WEBHOOK_RETRY_POLL_MS:5000}
      base-delay-ms: ${WEBHOOK_RETRY_BASE_DELAY_MS:10000}
      max-delay-ms: ${WEBHOOK_RETRY_MAX_DELAY_MS:1800000}
    http:
      connect-timeout-ms: ${WEBHOOK_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${WEBHOOK_READ_TIMEOUT_MS:5000}
    health:
      failed-window-minutes: ${WEBHOOK_HEALTH_FAILED_WINDOW_MINUTES:60}
      stuck-minutes: ${WEBHOOK_HEALTH_STUCK_MINUTES:10}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
