server:
  port: ${SERVER_PORT:8081}
spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: identity
    default-schema: identity
    create-schemas: true
zentro:
  security:
    issuer-uri: ${JWT_ISSUER_URI}
    audience: ${JWT_AUDIENCE}
    jwks-uri: ${JWT_JWKS_URI:}
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9081}
    enabled: ${GRPC_SERVER_ENABLED:true}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
