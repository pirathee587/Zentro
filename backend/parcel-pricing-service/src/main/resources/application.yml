server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: parcel-pricing-service
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
  flyway:
    schemas: pricing
    default-schema: pricing
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        # Bounded waits so a broker outage turns into a recorded, retried failure instead of a hang.
        "[max.block.ms]": ${KAFKA_MAX_BLOCK_MS:5000}
        "[request.timeout.ms]": ${KAFKA_REQUEST_TIMEOUT_MS:10000}
        "[delivery.timeout.ms]": ${KAFKA_DELIVERY_TIMEOUT_MS:30000}
zentro:
  assignment:
    eligible-statuses: ${ZENTRO_ASSIGNMENT_ELIGIBLE_STATUSES:}
    # Claim verification calls the trusted S3 origin; Compose supplies its
    # internal service DNS name rather than localhost.
    dispatch-base-url: ${DISPATCH_SERVICE_BASE_URL:http://localhost:8083}
  service:
    token-uri: ${SERVICE_TOKEN_URI:}
    client-id: ${SERVICE_CLIENT_ID:zentro-parcel-service}
    client-secret: ${SERVICE_CLIENT_SECRET:}
  identity:
    grpc-host: ${IDENTITY_GRPC_HOST:zentro-identity-partner-service}
    grpc-port: ${IDENTITY_GRPC_PORT:9081}
  security:
    public-get-paths:
      - /api/v1/parcels/tracking/*
    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/zentro}
    audience: ${JWT_AUDIENCE:zentro-api}
    jwks-uri: ${JWT_JWKS_URI:}
  outbox:
    # Off by default so tests and environments without a broker never try to connect.
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:5000}
    retry-base-delay-ms: ${OUTBOX_RETRY_BASE_DELAY_MS:1000}
    retry-max-delay-ms: ${OUTBOX_RETRY_MAX_DELAY_MS:300000}
    stuck-threshold-ms: ${OUTBOX_STUCK_THRESHOLD_MS:300000}
    topic-partitions: ${OUTBOX_TOPIC_PARTITIONS:3}
    topic-replicas: ${OUTBOX_TOPIC_REPLICAS:1}
    # Outbox event_type -> Kafka topic.
    topics:
      "[notification.parcel]": notification.parcel
      "[parcel.status.updated]": parcel.status.updated
      "[parcel.created]": parcel.created
management:
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
