server:
  port: ${SERVER_PORT:8082}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: pricing
    default-schema: pricing
    create-schemas: true
zentro:
  security:
    issuer-uri: ${JWT_ISSUER_URI}
    audience: ${JWT_AUDIENCE}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
