name: Task status sync

on:
  create:
  pull_request:
    branches: [develop, main]
    types: [opened, ready_for_review, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  sync-task-status:
    name: sync-task-status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Sync issue status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            const { taskStatusDecision } = require('./scripts/task-status-policy');

            async function getIssueNumberFromBranch(branch) {
              const match = branch.match(/^feature\/(\d+)-/);
              return match ? Number(match[1]) : null;
            }

            async function getIssueNumberFromPrBody(body) {
              const match = (body || "").match(/\b(?:Closes|Fixes|Resolves)\s+#(\d+)\b/i);
              return match ? Number(match[1]) : null;
            }

            async function addLabel(issue_number, name) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            }

            async function removeLabelIfPresent(issue_number, name) {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner, repo, issue_number
              });
              if (labels.some(label => label.name === name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }

            if (eventName === "create") {
              const { ref, ref_type } = context.payload;
              if (ref_type !== "branch") {
                core.info("Not a branch creation event; nothing to do.");
                return;
              }
              const issue_number = await getIssueNumberFromBranch(ref);
              if (!issue_number) {
                core.info("Branch does not match feature/<issue-number>-...; nothing to do.");
                return;
              }

              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number }));
              } catch (error) {
                core.warning(`Issue #${issue_number} could not be fetched: ${error.message}`);
                return;
              }
              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request, not an issue.`);
                return;
              }
              if (!issue.assignees || issue.assignees.length === 0) {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number, assignees: [context.actor]
                });
              }
              await addLabel(issue_number, "in-progress");
              core.info(`Updated issue #${issue_number} for branch ${ref}.`);
              return;
            }

            let pr = context.payload.pull_request;
            if (!pr && eventName === "check_run") {
              const candidate = context.payload.check_run.pull_requests?.[0];
              if (candidate) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: candidate.number }));
              }
            }
            if (!pr && eventName === "pull_request_review") {
              pr = context.payload.pull_request;
            }
            if (!pr) {
              core.info("Event is not associated with a pull request; nothing to do.");
              return;
            }
            if (!['develop', 'main'].includes(pr.base.ref)) {
              core.info("Pull request targets an unmanaged base branch; nothing to do.");
              return;
            }
            const issue_number = await getIssueNumberFromPrBody(pr.body);
            if (!issue_number) {
              core.info("PR has no closing reference; linked-issue check handles this.");
              return;
            }

            const action = context.payload.action;
            if (pr.draft) {
              core.info("Draft PRs do not move issues to in-review or done.");
              return;
            }

            async function hasIndependentApproval() {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number, per_page: 100
              });
              const latestByReviewer = new Map();
              for (const review of reviews) {
                if (review.user && review.user.login !== pr.user.login && review.state !== "PENDING") {
                  latestByReviewer.set(review.user.login, review.state);
                }
              }
              return [...latestByReviewer.values()].some(state => state === "APPROVED");
            }

            async function checksPassed() {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100
              });
              return data.check_runs.length > 0 && data.check_runs.every(check =>
                check.status === "completed" && check.conclusion === "success"
              );
            }

            const approved = await hasIndependentApproval();
            const green = await checksPassed();
            const decision = taskStatusDecision({
              eventName, action, draft: pr.draft, merged: pr.merged,
              independentApproval: approved, checksPassed: green
            });
            if (decision === "in-review") {
              await addLabel(issue_number, "in-review");
              await removeLabelIfPresent(issue_number, "in-progress");
              core.info(`Issue #${issue_number} moved to in-review.`);
            } else if (decision === "done") {
              await addLabel(issue_number, "done");
              await removeLabelIfPresent(issue_number, "in-review");
              const marker = `<!-- task-status-sync:merged-pr-${pr.number} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100
              });
              if (!comments.some(comment => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `Merged in PR #${pr.number} by @${context.actor}\n\n${marker}`
                });
              }
              core.info(`Issue #${issue_number} marked done after PR #${pr.number} merged.`);
            } else {
              core.info("PR state does not satisfy the transition policy.");
            }
