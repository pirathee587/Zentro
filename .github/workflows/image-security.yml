name: Image security
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'infra/compose/production/**'
      - '.dockerignore'
      - '.github/workflows/image-security.yml'
  workflow_call:
    inputs:
      archive_images:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  infrastructure-candidates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [caddy, kafka, keycloak]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and exercise candidate image
        working-directory: infra/compose/production
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          docker build --pull -f "candidates/$SERVICE.Dockerfile" -t candidate candidates
          case "$SERVICE" in
            caddy) docker run --rm --env-file release.env.example -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" candidate caddy validate --config /etc/caddy/Caddyfile ;;
            keycloak)
              docker run -d --name fixture -p 127.0.0.1:8080:8080 candidate start-dev --http-host=0.0.0.0 --http-relative-path=/auth
              curl --fail --retry 40 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/auth/realms/master/.well-known/openid-configuration >/dev/null || { docker logs --tail 80 fixture; exit 1; } ;;
            kafka)
              docker network create fixture
              docker run -d --name kafka --network fixture -e CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER -e KAFKA_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093 -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092 -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL candidate
              timeout 120 bash -c 'until docker exec kafka kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1; do sleep 3; done'
              docker exec kafka kafka-topics --bootstrap-server kafka:9092 --create --topic fixture --partitions 1 --replication-factor 1 ;;
          esac
      - name: Check candidate vulnerabilities
        env:
          TRIVY_IMAGE: ${{ vars.RELEASE_TRIVY_IMAGE }}
        run: |
          set -euo pipefail
          [[ "$TRIVY_IMAGE" =~ ^(docker.io/)?aquasec/trivy@sha256:[a-f0-9]{64}$ ]]
          docker save candidate -o "$RUNNER_TEMP/candidate.tar"
          docker run --rm -v "$RUNNER_TEMP/candidate.tar:/candidate.tar:ro" "$TRIVY_IMAGE" image --input /candidate.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate production Compose and Caddy
        working-directory: infra/compose/production
        run: |
          set -euo pipefail
          docker compose --env-file release.env.example config --quiet --no-env-resolution
          caddy_image="$(sed -n 's/^CADDY_IMAGE=//p' release.env.example)"
          docker run --rm --env-file release.env.example -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --network none -v "$PWD:/fixtures:ro" maven:3.9-eclipse-temurin-21 \
            bash /fixtures/test-deploy-app-images.sh /fixtures/deploy-app-images.sh
      - name: Build production images
        env:
          TRIVY_IMAGE: ${{ vars.RELEASE_TRIVY_IMAGE }}
        run: |
          set -euo pipefail
          [[ "$TRIVY_IMAGE" =~ ^(docker.io/)?aquasec/trivy@sha256:[a-f0-9]{64}$ ]]
          mkdir -p release-scans
          services=(api-gateway identity-partner-service parcel-pricing-service dispatch-courier-service tracking-reporting-service notification-integration-service)
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=()
          for service in "${services[@]}"; do
            tag="$registry/$service:$GITHUB_SHA"
            context=.
            if [[ "$service" == api-gateway ]]; then context=backend; fi
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --pull --load --build-arg "GIT_SHA=$GITHUB_SHA" \
              -f "backend/$service/Dockerfile" -t "$tag" "$context"
            tags+=("$tag")
          done
          failed=0
          for i in "${!services[@]}"; do
            service="${services[i]}"
            docker image save "${tags[i]}" -o "$PWD/release-scans/image.tar"
            scan=(docker run --rm -v "$PWD/release-scans:/reports" -v zentro-trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE")
            "${scan[@]}" image --timeout 15m --input /reports/image.tar --format cyclonedx --output "/reports/$service.sbom.json"
            "${scan[@]}" image --timeout 15m --input /reports/image.tar --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 --format json --output "/reports/$service.vulnerabilities.json" || failed=1
            docker image inspect "${tags[i]}" --format '{{.Id}}' >> release-scans/image-ids.txt
            rm release-scans/image.tar
          done
          for service in kafka keycloak caddy; do
            image="$(sed -n "s/^${service^^}_IMAGE=//p" infra/compose/production/release.env.example)"
            [[ -n "$image" ]]
            docker pull --platform linux/amd64 "$image"
            docker image save -o "$PWD/release-scans/image.tar" "$image"
            "${scan[@]}" image --timeout 15m --input /reports/image.tar --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 --format json \
              --output "/reports/$service.vulnerabilities.json" || failed=1
            rm release-scans/image.tar
          done
          [[ "$failed" == 0 ]]
          if [[ "${{ inputs.archive_images }}" == true ]]; then
            docker save "${tags[@]}" | gzip > production-images.tar.gz
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-image-security
          path: |
            release-scans/*.json
            release-scans/image-ids.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.archive_images
        with:
          name: production-images
          path: production-images.tar.gz
          retention-days: 3
