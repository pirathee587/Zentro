name: Task
description: Track a technical, maintenance, or documentation task
title: "[TASK] "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Task description
      description: What needs to be done and why?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the outcomes that mark this task complete.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, devops, docs]
    validations:
      required: true
