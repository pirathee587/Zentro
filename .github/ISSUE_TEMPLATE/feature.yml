name: Feature request
description: Propose a feature for Zentro
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List clear, testable outcomes.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, devops, docs]
    validations:
      required: true
