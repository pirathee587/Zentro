# DEVELOPMENT ONLY — full-stack Compose; not a production deployment definition.
# Run from project root:  docker compose up -d --build

services:
  # ── Backend micro‑services ──────────────────────────────
  # All backend Dockerfiles expect the build context to be backend/
  # because they COPY pom.xml, libs/, and sibling service pom.xml files.

  identity-partner-service:
    build:
      context: .
      dockerfile: backend/identity-partner-service/Dockerfile
    container_name: zentro-identity-partner-service
    env_file:
      - ./backend/identity-partner-service/.env
    environment:
      JWT_ISSUER_URI: http://localhost:8180/realms/zentro
      JWT_JWKS_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/certs
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks: [zentro, keycloak]
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: zentro-api-gateway
    env_file:
      - ./backend/api-gateway/.env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      identity-partner-service:
        condition: service_healthy
      parcel-pricing-service:
        condition: service_healthy
      dispatch-courier-service:
        condition: service_healthy
      tracking-reporting-service:
        condition: service_healthy
      notification-integration-service:
        condition: service_healthy
    networks: [zentro, keycloak]
    restart: unless-stopped

  parcel-pricing-service:
    build:
      context: .
      dockerfile: backend/parcel-pricing-service/Dockerfile
    container_name: zentro-parcel-pricing-service
    env_file:
      - ./backend/parcel-pricing-service/.env
    environment:
      JWT_ISSUER_URI: http://localhost:8180/realms/zentro
      JWT_JWKS_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/certs
      SERVICE_TOKEN_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/token
      SERVICE_CLIENT_ID: zentro-parcel-service
      SERVICE_CLIENT_SECRET: ${ZENTRO_PARCEL_SERVICE_CLIENT_SECRET:-}
      IDENTITY_GRPC_HOST: identity-partner-service
      IDENTITY_GRPC_PORT: "9081"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks: [zentro, keycloak]
    depends_on:
      identity-partner-service:
        condition: service_healthy
    restart: unless-stopped

  dispatch-courier-service:
    build:
      context: .
      dockerfile: backend/dispatch-courier-service/Dockerfile
    container_name: zentro-dispatch-courier-service
    env_file:
      - ./backend/dispatch-courier-service/.env
    environment:
      JWT_ISSUER_URI: http://localhost:8180/realms/zentro
      JWT_JWKS_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/certs
      POD_TOKEN_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/token
      POD_CLIENT_ID: zentro-dispatch-service
      POD_CLIENT_SECRET: ${ZENTRO_DISPATCH_SERVICE_CLIENT_SECRET:-}
      IDENTITY_GRPC_HOST: identity-partner-service
      IDENTITY_GRPC_PORT: "9081"
      PARCEL_GRPC_HOST: parcel-pricing-service
      PARCEL_GRPC_PORT: "9082"
      # Shared S3 Supabase must never be migrated by application startup: its history
      # uses the historical V5 lineage. These override any env_file value. Migrations
      # run only via a separately authorized runbook (docs/development/s3-flyway-safety.md).
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      POD_WORKER_ENABLED: "false"
      OUTBOX_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks: [zentro, keycloak]
    depends_on:
      identity-partner-service:
        condition: service_healthy
      parcel-pricing-service:
        condition: service_healthy
    restart: unless-stopped

  tracking-reporting-service:
    build:
      context: .
      dockerfile: backend/tracking-reporting-service/Dockerfile
    container_name: zentro-tracking-reporting-service
    env_file:
      - ./backend/tracking-reporting-service/.env
    environment:
      JWT_ISSUER_URI: http://localhost:8180/realms/zentro
      JWT_JWKS_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/certs
      SERVICE_TOKEN_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/token
      SERVICE_CLIENT_ID: zentro-tracking-service
      SERVICE_CLIENT_SECRET: ${ZENTRO_TRACKING_SERVICE_CLIENT_SECRET:-}
      PARCEL_GRPC_HOST: parcel-pricing-service
      PARCEL_GRPC_PORT: "9082"
      DISPATCH_GRPC_HOST: dispatch-courier-service
      DISPATCH_GRPC_PORT: "9083"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks: [zentro, keycloak]
    depends_on:
      parcel-pricing-service:
        condition: service_healthy
      dispatch-courier-service:
        condition: service_healthy
    restart: unless-stopped

  notification-integration-service:
    build:
      context: .
      dockerfile: backend/notification-integration-service/Dockerfile
    container_name: zentro-notification-integration-service
    env_file:
      - ./backend/notification-integration-service/.env
    environment:
      JWT_ISSUER_URI: http://localhost:8180/realms/zentro
      JWT_JWKS_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/certs
      SERVICE_TOKEN_URI: http://keycloak:8080/realms/zentro/protocol/openid-connect/token
      SERVICE_CLIENT_ID: zentro-notification-service
      SERVICE_CLIENT_SECRET: ${ZENTRO_NOTIFICATION_SERVICE_CLIENT_SECRET:-}
      IDENTITY_GRPC_HOST: identity-partner-service
      IDENTITY_GRPC_PORT: "9081"
      PARCEL_GRPC_HOST: parcel-pricing-service
      PARCEL_GRPC_PORT: "9082"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks: [zentro, keycloak]
    depends_on:
      identity-partner-service:
        condition: service_healthy
      parcel-pricing-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Vite/React → Nginx) ──────────────────────
  zentro-web:
    build:
      context: ./frontend/zentro-web
      dockerfile: Dockerfile
    container_name: zentro-web
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:8080"
    networks: [zentro]
    restart: unless-stopped

networks:
  zentro:
    name: zentro-backend
  keycloak:
    name: keycloak_default
    external: true
