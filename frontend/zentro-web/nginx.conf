server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # __KEYCLOAK_URL__ is replaced at image build time with VITE_KEYCLOAK_URL. frame-src must allow it:
  # tokens live in memory only, so refreshes and direct URLs restore the session through the
  # OIDC silent check (a hidden iframe to Keycloak that returns to /silent-callback).
  # blob: is limited to browser-created local previews selected by the courier; it does not
  # grant remote image access. Private dispatcher evidence still uses short-lived HTTPS URLs.
  set $csp "default-src 'self'; connect-src 'self' http: https:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; frame-src 'self' __KEYCLOAK_URL__";

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "$csp; frame-ancestors 'none'" always;

  # Only the silent-check return page may be framed, and only by this application itself.
  location = /silent-callback {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "$csp; frame-ancestors 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "$csp; frame-ancestors 'none'" always;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
